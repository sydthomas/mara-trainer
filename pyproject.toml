[project]
name = "mara-trainer"
version = "0.1.0"
description = "Personal spring-marathon coach: a small local Python core that Claude Code drives."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sydney Thomas" }]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "garmin-fit-sdk>=21.171",
    "gpxpy>=1.6",
]

[project.scripts]
coach = "mara_coach.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mara_trainer", "src/mara_coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
